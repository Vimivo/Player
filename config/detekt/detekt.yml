build:
  maxIssues: 0
complexity:
  LongMethod:
    threshold: 150
  TooManyFunctions:
    thresholdInClasses: 40
    thresholdInInterfaces: 25
naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  MatchingDeclarationName:
    active: false
style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
formatting:
  active: false

