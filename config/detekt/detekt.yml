build:
  maxIssues: 0
complexity:
  LongMethod:
    threshold: 120
  TooManyFunctions:
    thresholdInClasses: 30
    thresholdInInterfaces: 20
naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 3

