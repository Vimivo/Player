name: Windows Desktop Quality & Packaging

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download pinned libmpv for Windows x64
        shell: pwsh
        env:
          # Update both values together; the digest is the one GitHub publishes for the release asset.
          MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261016/mpv-dev-x86_64-20261016-git-a2cd83c56d.7z
          MPV_SHA256: 0142058a8d20930f1c086d0c16a593f9e27a8b3fe9d1f4bb3b2ee4a2d5ec994b
        run: |
          Invoke-WebRequest -Uri $env:MPV_URL -OutFile "mpv-dev.7z"
          $actual = (Get-FileHash -Path "mpv-dev.7z" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:MPV_SHA256) {
            Write-Error "libmpv checksum mismatch: expected $env:MPV_SHA256, got $actual"
            exit 1
          }
          7z x mpv-dev.7z -o"windows-mpv" | Out-Null
          if (-not (Test-Path "windows-mpv\libmpv-2.dll")) {
            Write-Error "libmpv-2.dll is missing from the pinned archive"
            exit 1
          }
          Write-Host "libmpv verified ($actual)"

      - name: Generate smoke-test media
        shell: pwsh
        run: |
          # The Chocolatey community feed sometimes answers 503; ffmpeg only generates test media, so retry.
          foreach ($attempt in 1..4) {
            choco install ffmpeg --no-progress -y
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            if (Test-Path "C:\ProgramData\chocolatey\bin\ffmpeg.exe") { break }
            Write-Host "ffmpeg install attempt $attempt failed; retrying in 30 s"
            Start-Sleep -Seconds 30
          }
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          python testmedia/generate_media.py

      - name: Compile and run tests
        env:
          # Live libmpv tests load the pinned DLL; without it they skip.
          VIMIVO_TEST_MPV_DIR: ${{ github.workspace }}\windows-mpv
        run: ./gradlew :desktopApp:compileKotlinDesktop :desktopApp:desktopTest :shared:desktopTest :desktopApp:detekt

      - name: Build Windows distributable (with the MSVC environment for the media controls bridge)
        shell: cmd
        env:
          # createDistributable is finalized by bundleWindowsMpv, which copies the DLLs from this directory.
          VIMIVO_WINDOWS_MPV_DIR: ${{ github.workspace }}\windows-mpv
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call gradlew.bat :desktopApp:createDistributable :desktopApp:packageExe :desktopApp:packageMsi || exit /b 1

      - name: Verify bundled native libraries
        shell: pwsh
        run: |
          foreach ($dll in @("libmpv-2.dll", "vimivo_media_controls.dll")) {
            if (-not (Test-Path "desktopApp/build/compose/binaries/main/app/Vimivo/$dll")) {
              Write-Error "$dll was not bundled into the distributable"
              exit 1
            }
          }

      - name: Smoke-test the packaged app (launch + local video and audio playback)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "vimivo-smoke.log"
          $env:VIMIVO_SMOKE_REPORT = $report
          $media = @("video_landscape.mp4", "video_sample.mkv", "track2_lunar.mp3", "track1_solaris.flac") |
            ForEach-Object { '"' + (Join-Path $PWD "testmedia\$_") + '"' }
          $process = Start-Process -FilePath "desktopApp/build/compose/binaries/main/app/Vimivo/Vimivo.exe" `
            -ArgumentList (@("--smoke-test") + $media) -PassThru
          # A hard limit turns a hang into a failure instead of a stuck job.
          if (-not $process.WaitForExit(240000)) {
            Stop-Process -Id $process.Id -Force
            Write-Error "Smoke test timed out"
            exit 1
          }
          if (Test-Path $report) { Get-Content $report }
          $passed = if (Test-Path $report) { (Select-String -Path $report -Pattern "^VIMIVO_SMOKE PASS").Count } else { 0 }
          if ($process.ExitCode -ne 0 -or $passed -ne 7) {  # 4 files + 3 window-change picture checks
            Write-Error "Smoke test failed (exit $($process.ExitCode), $passed/4 passed)"
            exit 1
          }

      - name: Verify installers and generate SHA-256 checksums
        shell: pwsh
        run: |
          $distDir = "desktopApp/build/compose/binaries/main"
          $installers = Get-ChildItem -Path $distDir -Recurse -Include *.exe, *.msi | Where-Object { $_.FullName -notmatch "temp" }
          if ($installers.Count -eq 0) {
            Write-Error "No Windows installer artifacts found in $distDir"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "build/artifacts"
          foreach ($installer in $installers) {
            $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
            Write-Host "$($installer.Name): $($hash.Hash)"
            Copy-Item $installer.FullName -Destination "build/artifacts/$($installer.Name)"
            "$($hash.Hash)  $($installer.Name)" | Out-File -FilePath "build/artifacts/$($installer.Name).sha256" -Encoding ascii
          }

      - name: Upload Windows distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vimivo-windows-installers
          path: build/artifacts/*
          if-no-files-found: error
