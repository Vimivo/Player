name: Windows Desktop Quality & Packaging

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run tests
        run: ./gradlew :desktopApp:compileKotlinDesktop :desktopApp:desktopTest :shared:desktopTest :desktopApp:detekt

      - name: Download pinned libmpv for Windows x64
        shell: pwsh
        run: |
          $mpvUrl = "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20240407-git-1f9db50.7z/download"
          Invoke-WebRequest -Uri $mpvUrl -OutFile "mpv-dev.7z" -UserAgent "Mozilla/5.0"
          7z x mpv-dev.7z -o"windows-mpv"
          if (Test-Path "windows-mpv\mpv-2.dll") {
            Write-Host "Downloaded and unpacked libmpv Windows x64 successfully"
          } else {
            Write-Host "libmpv extraction completed"
          }

      - name: Build Windows Distributable & Package EXE / MSI
        shell: pwsh
        env:
          VIMIVO_WINDOWS_MPV_DIR: "${{ github.workspace }}\\windows-mpv"
        run: |
          ./gradlew :desktopApp:createDistributable
          python desktopApp/scripts/bundle_windows_mpv.py build/compose/binaries/main/app/Vimivo "${{ github.workspace }}\\windows-mpv"
          ./gradlew :desktopApp:packageExe :desktopApp:packageMsi

      - name: Verify installers and generate SHA-256 checksums
        shell: pwsh
        run: |
          $distDir = "desktopApp/build/compose/binaries/main"
          $installers = Get-ChildItem -Path $distDir -Recurse -Include *.exe, *.msi | Where-Object { $_.FullName -notmatch "temp" }
          if ($installers.Count -eq 0) {
            Write-Error "No Windows installer artifacts found in $distDir"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "build/artifacts"
          foreach ($installer in $installers) {
            $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
            Write-Host "$($installer.Name): $($hash.Hash)"
            Copy-Item $installer.FullName -Destination "build/artifacts/$($installer.Name)"
            "$($hash.Hash)  $($installer.Name)" | Out-File -FilePath "build/artifacts/$($installer.Name).sha256" -Encoding ascii
          }

      - name: Upload Windows distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vimivo-windows-installers
          path: build/artifacts/*
          if-no-files-found: error
