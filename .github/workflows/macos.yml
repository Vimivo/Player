name: macOS Desktop Quality & Packaging

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libmpv via Homebrew
        run: |
          brew update
          brew install mpv

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run desktop tests
        run: ./gradlew :desktopApp:compileKotlinDesktop :desktopApp:desktopTest :shared:desktopTest :desktopApp:detekt

      - name: Build macOS DMG package and bundle native dependencies
        run: ./gradlew :desktopApp:packageDmg

      - name: Verify standalone package dependencies
        run: |
          appPath="desktopApp/build/compose/binaries/main/app/Vimivo.app"
          frameworksDir="$appPath/Contents/Frameworks"
          if [ ! -d "$frameworksDir" ]; then
            echo "Error: Frameworks directory not found in $appPath"
            exit 1
          fi
          echo "Verifying zero /opt/homebrew references in bundled dylibs..."
          find "$frameworksDir" -name "*.dylib" | while read -r dylib; do
            if otool -L "$dylib" | grep -q "/opt/homebrew"; then
              echo "Error: Found /opt/homebrew reference in $dylib"
              exit 1
            fi
          done
          echo "Verification passed: All dylibs relocatable."

      - name: Verify DMG and calculate SHA-256
        run: |
          dmgPath="desktopApp/build/compose/binaries/main/dmg/Vimivo-1.0.0.dmg"
          if [ ! -f "$dmgPath" ]; then
            echo "Error: DMG file not found at $dmgPath"
            exit 1
          fi
          mkdir -p build/artifacts
          cp "$dmgPath" "build/artifacts/Vimivo-1.0.0.dmg"
          shasum -a 256 "build/artifacts/Vimivo-1.0.0.dmg" | awk '{print $1}' > "build/artifacts/Vimivo-1.0.0.dmg.sha256"
          echo "Vimivo-1.0.0.dmg SHA-256: $(cat build/artifacts/Vimivo-1.0.0.dmg.sha256)"

      - name: Upload macOS distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vimivo-macos-dmg
          path: build/artifacts/*
          if-no-files-found: error
