name: Android Quality & Packaging

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, static analysis, lint, and debug build
        run: ./gradlew testDebugUnitTest detekt lintDebug :androidApp:assembleDebug

      - name: Assemble release APK and App Bundle
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Collect artifacts and calculate SHA-256
        run: |
          mkdir -p build/artifacts
          apkPath=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          aabPath=$(find androidApp/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$apkPath" ]; then
            cp "$apkPath" build/artifacts/
            apkName=$(basename "$apkPath")
            sha256sum "build/artifacts/$apkName" | awk '{print $1}' > "build/artifacts/${apkName}.sha256"
            echo "APK SHA-256: $(cat build/artifacts/${apkName}.sha256)"
          fi
          if [ -f "$aabPath" ]; then
            cp "$aabPath" build/artifacts/
            aabName=$(basename "$aabPath")
            sha256sum "build/artifacts/$aabName" | awk '{print $1}' > "build/artifacts/${aabName}.sha256"
            echo "AAB SHA-256: $(cat build/artifacts/${aabName}.sha256)"
          fi

      - name: Upload Android distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vimivo-android-packages
          path: build/artifacts/*
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
