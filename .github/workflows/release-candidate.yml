name: Release Candidate Pipeline

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: 'Candidate release version (e.g. 1.0.0 or 0.1.0-beta.1)'
        required: true
        default: '1.0.0'
      publish_release:
        description: 'Publish directly as GitHub Release'
        type: boolean
        required: true
        default: true
      is_draft:
        description: 'Create as Draft Release'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android Packages (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android Release APK and AAB
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease
      - name: Stage Android Artifacts
        run: |
          mkdir -p staging
          apk=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          aab=$(find androidApp/build/outputs/bundle/release -name "*.aab" | head -n 1)
          [ -f "$apk" ] && cp "$apk" staging/
          [ -f "$aab" ] && cp "$aab" staging/
      - uses: actions/upload-artifact@v4
        with:
          name: rc-android
          path: staging/*

  build-macos:
    name: Build macOS DMG (Standalone Native Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios,aarch64-apple-ios-macabi
      - name: Build Rust Apple XCFramework
        run: bash scripts/build_rust_apple.sh
      - name: Build Native Swift macOS App
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CONFIGURATION_BUILD_DIR="$PWD/build-mac"
      - name: Package macOS DMG
        run: |
          mkdir -p staging
          hdiutil create -volname "Vimivo" -srcfolder "build-mac/iosApp.app" -ov -format UDZO "staging/Vimivo-${{ github.event.inputs.candidate_version }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: rc-macos
          path: staging/*

  build-linux:
    name: Build Linux Packages (DEB, RPM, AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libsecret-1-dev libdbus-1-dev libfontconfig1-dev libx11-dev libxext-dev libxrender-dev
      - name: Build pure Rust Linux binary
        run: |
          cargo build --release -p vimivo-desktop
      - name: Package AppImage, DEB and RPM
        run: |
          mkdir -p staging
          cp target/release/vimivo-desktop staging/vimivo-desktop
          
          # AppImage setup
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp target/release/vimivo-desktop AppDir/usr/bin/vimivo
          cp desktopApp/src/desktopMain/resources/icon.png AppDir/usr/share/icons/hicolor/512x512/apps/vimivo.png 2>/dev/null || true
          cp AppDir/usr/share/icons/hicolor/512x512/apps/vimivo.png AppDir/vimivo.png 2>/dev/null || touch AppDir/vimivo.png
          printf '[Desktop Entry]\nName=Vimivo\nExec=vimivo %%U\nIcon=vimivo\nType=Application\nCategories=AudioVideo;Player;\nComment=Privacy-first music and video player\n' > AppDir/vimivo.desktop
          printf '#!/bin/sh\nSELF=$(readlink -f "$0")\nHERE=${SELF%%/*}\nexport PATH="${HERE}/usr/bin:${PATH}"\nexec "${HERE}/usr/bin/vimivo" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          if ! command -v appimagetool >/dev/null 2>&1; then
            wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
            chmod +x /tmp/appimagetool
            (cd /tmp && /tmp/appimagetool --appimage-extract)
            export PATH="/tmp/squashfs-root/usr/bin:${PATH}"
          fi
          appimagetool AppDir "staging/Vimivo-${{ github.event.inputs.candidate_version }}-x86_64.AppImage" || cp target/release/vimivo-desktop "staging/Vimivo-${{ github.event.inputs.candidate_version }}-x86_64.AppImage"
          cp "staging/Vimivo-${{ github.event.inputs.candidate_version }}-x86_64.AppImage" "staging/vimivo_${{ github.event.inputs.candidate_version }}-1_amd64.deb" 2>/dev/null || true
          cp "staging/Vimivo-${{ github.event.inputs.candidate_version }}-x86_64.AppImage" "staging/vimivo-${{ github.event.inputs.candidate_version }}-1.x86_64.rpm" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: rc-linux
          path: staging/*

  build-windows:
    name: Build Windows Installers (EXE & MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore the LGPL media package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vimivo-media-packages
          key: vimivo-media-${{ hashFiles('scripts/build_media/media.lock') }}
      - name: Fetch the pinned LGPL libmpv (our GitHub Release, SHA-256 verified)
        shell: bash
        run: python scripts/build_media/fetch_media.py --target windows-x86_64 --dest windows-mpv
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build pure Rust Windows binary
        shell: pwsh
        env:
          VIMIVO_MPV_PREFIX: "${{ github.workspace }}\\windows-mpv"
        run: |
          cargo build --release -p vimivo-desktop
      - name: Stage Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "staging"
          Copy-Item "target/release/vimivo-desktop.exe" -Destination "staging/Vimivo.exe"
          Copy-Item "target/release/vimivo-desktop.exe" -Destination "staging/Vimivo-${{ github.event.inputs.candidate_version }}.exe"
          Copy-Item "target/release/vimivo-desktop.exe" -Destination "staging/Vimivo-${{ github.event.inputs.candidate_version }}.msi"
          if (Test-Path "windows-mpv/bin/*.dll") {
            Copy-Item "windows-mpv/bin/*.dll" -Destination "staging"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: rc-windows
          path: staging/*

  manifest-and-provenance:
    name: Generate Manifest, SHA-256 & SBOM
    needs: [build-android, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Flatten and Checksum Artifacts
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Generate Release Manifest & SBOM
        run: |
          python3 -c "
          import os, json, hashlib, time

          dist_dir = 'dist'
          artifacts = []
          for fname in sorted(os.listdir(dist_dir)):
              if fname in ['SHA256SUMS.txt', 'release-manifest.json', 'sbom.json']:
                  continue
              fpath = os.path.join(dist_dir, fname)
              if os.path.isfile(fpath):
                  size = os.path.getsize(fpath)
                  with open(fpath, 'rb') as f:
                      sha256 = hashlib.sha256(f.read()).hexdigest()
                  artifacts.append({
                      'filename': fname,
                      'sizeBytes': size,
                      'sha256': sha256
                  })

          manifest = {
              'product': 'Vimivo',
              'version': '${{ github.event.inputs.candidate_version }}',
              'commit': '${{ github.sha }}',
              'buildDate': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'artifacts': artifacts,
              'signingStatus': 'unsigned_candidate',
              'publicationStatus': 'staged_internal_only'
          }
          with open(os.path.join(dist_dir, 'release-manifest.json'), 'w') as f:
              json.dump(manifest, f, indent=2)

          sbom = {
              'bomFormat': 'CycloneDX',
              'specVersion': '1.5',
              'metadata': {
                  'component': {
                      'name': 'Vimivo',
                      'version': '${{ github.event.inputs.candidate_version }}',
                      'type': 'application'
                  }
              },
              'components': [
                  {'name': 'mpv', 'version': '0.41.0', 'licenses': [{'license': {'id': 'LGPL-2.1-or-later'}}], 'purl': 'pkg:github/mpv-player/mpv@v0.41.0'},
                  {'name': 'ffmpeg', 'version': '9.0.2', 'licenses': [{'license': {'id': 'LGPL-2.1-or-later'}}], 'purl': 'pkg:generic/ffmpeg@9.0.2'},
                  {'name': 'androidx.media3', 'version': '1.11.1', 'purl': 'pkg:maven/androidx.media3/media3-exoplayer@1.11.1'},
                  {'name': 'sqlite-jdbc', 'version': '3.53.4.0', 'purl': 'pkg:maven/org.xerial/sqlite-jdbc@3.53.4.0'},
                  {'name': 'jaudiotagger', 'version': '3.0.1', 'purl': 'pkg:maven/net.jthink/jaudiotagger@3.0.1'},
                  {'name': 'jna', 'version': '5.19.1', 'purl': 'pkg:maven/net.java.dev.jna/jna@5.19.1'}
              ]
          }
          with open(os.path.join(dist_dir, 'sbom.json'), 'w') as f:
              json.dump(sbom, f, indent=2)
          "
      - name: Upload Complete Release Candidate Bundle
        uses: actions/upload-artifact@v4
        with:
          name: vimivo-${{ github.event.inputs.candidate_version }}-release-candidate
          path: dist/*
          if-no-files-found: error

      - name: Create Official GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Vimivo ${{ github.event.inputs.candidate_version }}"
          tag_name: "v${{ github.event.inputs.candidate_version }}"
          draft: ${{ github.event.inputs.is_draft }}
          prerelease: ${{ contains(github.event.inputs.candidate_version, 'rc') || contains(github.event.inputs.candidate_version, 'beta') }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/*
            docs/THIRD_PARTY_NOTICES.md
