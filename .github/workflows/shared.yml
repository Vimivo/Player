name: Shared Quality & PR Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt static analysis
        run: ./gradlew detekt

      - name: Run shared cross-platform unit tests
        run: ./gradlew :shared:desktopTest

      - name: Validate documentation cross-links
        run: ./scripts/validate_docs.sh
