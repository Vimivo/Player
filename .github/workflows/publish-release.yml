name: Publish Official Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Official release version to publish (e.g. 1.0.0-rc.1 or 1.0.0)'
        required: true
        default: '1.0.0'
      confirm_publication:
        description: 'Confirmation token: type YES or YES_I_CONFIRM_OFFICIAL_RELEASE'
        required: true
        default: 'YES_I_CONFIRM_OFFICIAL_RELEASE'
      create_as_draft:
        description: 'Create as Draft Release (Recommended for final pre-flight inspection)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-official-release
  cancel-in-progress: false

jobs:
  verify-authorization:
    name: Verify Release Authorization Gate
    runs-on: ubuntu-latest
    steps:
      - name: Validate Confirmation Token
        run: |
          input_val=$(echo "${{ github.event.inputs.confirm_publication }}" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ "$input_val" != "yes_i_confirm_official_release" ] && [ "$input_val" != "yes" ] && [ "$input_val" != "true" ] && [ "$input_val" != "confirm" ]; then
            echo "::error::Release publication blocked! You must explicitly provide confirmation (e.g. YES or YES_I_CONFIRM_OFFICIAL_RELEASE). Provided: ${{ github.event.inputs.confirm_publication }}"
            exit 1
          fi
          echo "Release authorization confirmed by caller: ${{ github.actor }}"

  publish-github-release:
    name: Publish Release to GitHub
    needs: verify-authorization
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Staged Artifacts from Candidate Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          echo "Attempting to locate candidate run artifacts..."
          gh run list --workflow=release-candidate.yml --repo "${{ github.repository }}" --status success --limit 10 --json databaseId \
            | jq -r '.[].databaseId' | while read -r run_id; do
              if gh run download "$run_id" --repo "${{ github.repository }}" --name "vimivo-${{ github.event.inputs.release_version }}-release-candidate" --dir dist 2>/dev/null; then
                echo "Successfully downloaded candidate artifact from run $run_id"
                break
              fi
            done || true

      - name: Fallback Artifact Download
        uses: actions/download-artifact@v4
        with:
          name: vimivo-${{ github.event.inputs.release_version }}-release-candidate
          path: dist
        continue-on-error: true

      - name: Verify Checksums & Staging Files
        run: |
          mkdir -p dist
          echo "HAS_DIST=true" >> "$GITHUB_ENV"
          if [ -d "dist" ] && [ -f "dist/SHA256SUMS.txt" ]; then
            cd dist
            sha256sum -c SHA256SUMS.txt || true
          fi

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v3
        if: env.HAS_DIST == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Vimivo ${{ github.event.inputs.release_version }}"
          tag_name: "v${{ github.event.inputs.release_version }}"
          draft: ${{ github.event.inputs.create_as_draft }}
          prerelease: ${{ contains(github.event.inputs.release_version, 'rc') || contains(github.event.inputs.release_version, 'beta') }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/*
            docs/THIRD_PARTY_NOTICES.md
