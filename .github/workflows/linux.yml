name: Linux Desktop Quality & Packaging

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux packaging tools and the media package's system libraries
        # libmpv and FFmpeg come from our own LGPL package below; only the system libraries it links against
        # (VA-API, PulseAudio, ALSA, EGL, X11 extensions) come from the distribution.
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libsecret-1-dev libdbus-1-dev xvfb dbus dbus-x11 gnome-keyring playerctl \
            libva2 libva-x11-2 libva-drm2 libpulse0 libasound2t64 libegl1 libxss1 libxpresent1 libfontconfig1

      - name: Restore the LGPL media package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vimivo-media-packages
          key: vimivo-media-${{ hashFiles('scripts/build_media/media.lock') }}

      - name: Fetch the pinned LGPL libmpv (our GitHub Release, SHA-256 verified)
        # Built by build-media.yml from scripts/build_media (ADR-004). The test media is checked in.
        run: |
          python3 scripts/build_media/fetch_media.py --target linux-x86_64 --dest "$RUNNER_TEMP/vimivo-media"
          echo "VIMIVO_LINUX_MPV_DIR=$RUNNER_TEMP/vimivo-media/lib" >> "$GITHUB_ENV"
          echo "VIMIVO_TEST_MPV_DIR=$RUNNER_TEMP/vimivo-media/lib" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run tests
        # Live libmpv, AWT and Secret Service tests need a display, a D-Bus session and an unlocked keyring.
        run: |
          xvfb-run -a dbus-run-session -- bash -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            ./gradlew :desktopApp:compileKotlinDesktop :desktopApp:desktopTest :shared:desktopTest :desktopApp:detekt
          '

      - name: Build Linux Distributable & Bundle Native Dependencies
        run: |
          # createDistributable is finalized by bundleLinuxMpv, which copies VIMIVO_LINUX_MPV_DIR into lib/.
          ./gradlew :desktopApp:createDistributable
          test -e desktopApp/build/compose/binaries/main/app/Vimivo/lib/libmpv.so.2
          test -f desktopApp/build/compose/binaries/main/app/Vimivo/lib/media-build-info.json

      - name: Smoke-test the packaged app (launch + local video and audio playback)
        run: |
          # A hard limit turns a hang (e.g. a shutdown deadlock) into a failure instead of a stuck job.
          export VIMIVO_MPV_LOG_FILE="$PWD/mpv.log"
          timeout 240 xvfb-run -a -s "-screen 0 1280x800x24" desktopApp/build/compose/binaries/main/app/Vimivo/bin/Vimivo --smoke-test \
            "$PWD/testmedia/video_landscape.mp4" "$PWD/testmedia/video_sample.mkv" \
            "$PWD/testmedia/track2_lunar.mp3" "$PWD/testmedia/track1_solaris.flac" 2>&1 | tee smoke.log || true
          if [ "$(grep -c '^VIMIVO_SMOKE PASS' smoke.log)" -ne 7 ]; then
            echo "--- libmpv log (warnings and errors) ---"
            grep -E '\]\[(e|w|i)\]\[' mpv.log | head -250 || true
            exit 1
          fi

      - name: Verify MPRIS media controls with playerctl
        run: bash desktopApp/scripts/verify_mpris.sh "$PWD/desktopApp/build/compose/binaries/main/app/Vimivo/bin/Vimivo"

      - name: Package DEB and RPM
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm

      - name: Package AppImage
        run: |
          # Download appimagetool if not installed
          if ! command -v appimagetool >/dev/null 2>&1; then
            wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
            chmod +x /tmp/appimagetool
            # Extract AppImage in runner since FUSE is not enabled by default in container
            (cd /tmp && /tmp/appimagetool --appimage-extract)
            export PATH="/tmp/squashfs-root/usr/bin:${PATH}"
          fi
          bash desktopApp/scripts/build_appimage.sh desktopApp/build/compose/binaries/main/app/Vimivo desktopApp/build/compose/binaries/main/appimage

      - name: Verify packages and generate SHA-256 checksums
        run: |
          distDir="desktopApp/build/compose/binaries/main"
          mkdir -p build/artifacts
          find "$distDir" -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) ! -path "*/temp/*" | while read -r pkg; do
            filename=$(basename "$pkg")
            echo "Processing $filename..."
            cp "$pkg" "build/artifacts/$filename"
            sha256sum "$pkg" | awk '{print $1}' > "build/artifacts/${filename}.sha256"
            echo "$filename: $(cat build/artifacts/${filename}.sha256)"
          done

      - name: Upload Linux distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vimivo-linux-packages
          path: build/artifacts/*
          if-no-files-found: error
