name: Linux Desktop Quality & Packaging

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux packaging tools and libmpv
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libmpv-dev libmpv2 libsecret-1-dev libdbus-1-dev ffmpeg xvfb dbus dbus-x11 gnome-keyring playerctl

      - name: Generate smoke-test media
        run: python3 testmedia/generate_media.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run tests
        # Live libmpv, AWT and Secret Service tests need a display, a D-Bus session and an unlocked keyring.
        run: |
          xvfb-run -a dbus-run-session -- bash -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            ./gradlew :desktopApp:compileKotlinDesktop :desktopApp:desktopTest :shared:desktopTest :desktopApp:detekt
          '

      - name: Build Linux Distributable & Bundle Native Dependencies
        run: |
          ./gradlew :desktopApp:createDistributable
          python3 desktopApp/scripts/bundle_linux_mpv.py desktopApp/build/compose/binaries/main/app/Vimivo /usr/lib/x86_64-linux-gnu

      - name: Smoke-test the packaged app (launch + local video and audio playback)
        run: |
          # A hard limit turns a hang (e.g. a shutdown deadlock) into a failure instead of a stuck job.
          timeout 240 xvfb-run -a -s "-screen 0 1280x800x24" desktopApp/build/compose/binaries/main/app/Vimivo/bin/Vimivo --smoke-test \
            "$PWD/testmedia/video_landscape.mp4" "$PWD/testmedia/video_sample.mkv" \
            "$PWD/testmedia/track2_lunar.mp3" "$PWD/testmedia/track1_solaris.flac" | tee smoke.log
          test "$(grep -c '^VIMIVO_SMOKE PASS' smoke.log)" -eq 4

      - name: Verify MPRIS media controls with playerctl
        run: bash desktopApp/scripts/verify_mpris.sh "$PWD/desktopApp/build/compose/binaries/main/app/Vimivo/bin/Vimivo"

      - name: Package DEB and RPM
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm

      - name: Package AppImage
        run: |
          # Download appimagetool if not installed
          if ! command -v appimagetool >/dev/null 2>&1; then
            wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
            chmod +x /tmp/appimagetool
            # Extract AppImage in runner since FUSE is not enabled by default in container
            (cd /tmp && /tmp/appimagetool --appimage-extract)
            export PATH="/tmp/squashfs-root/usr/bin:${PATH}"
          fi
          bash desktopApp/scripts/build_appimage.sh desktopApp/build/compose/binaries/main/app/Vimivo desktopApp/build/compose/binaries/main/appimage

      - name: Verify packages and generate SHA-256 checksums
        run: |
          distDir="desktopApp/build/compose/binaries/main"
          mkdir -p build/artifacts
          find "$distDir" -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) ! -path "*/temp/*" | while read -r pkg; do
            filename=$(basename "$pkg")
            echo "Processing $filename..."
            cp "$pkg" "build/artifacts/$filename"
            sha256sum "$pkg" | awk '{print $1}' > "build/artifacts/${filename}.sha256"
            echo "$filename: $(cat build/artifacts/${filename}.sha256)"
          done

      - name: Upload Linux distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vimivo-linux-packages
          path: build/artifacts/*
          if-no-files-found: error
