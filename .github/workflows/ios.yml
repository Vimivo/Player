name: iOS & iPadOS Quality & Archive

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-archive:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Compile Kotlin Multiplatform shared framework
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64

      - name: Run iOS Simulator unit tests
        run: |
          # Discover an available iPhone simulator
          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone (15|16|17)" | head -n 1 | sed -E 's/^[[:space:]]*([^(]+) \(.*/\1/')
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 16"
          fi
          echo "Running tests on simulator: $SIM_NAME"
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned Xcode archive
        run: |
          mkdir -p build/artifacts
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -archivePath build/artifacts/Vimivo.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Calculate archive checksum
        run: |
          (cd build/artifacts && zip -r Vimivo.xcarchive.zip Vimivo.xcarchive)
          shasum -a 256 build/artifacts/Vimivo.xcarchive.zip | awk '{print $1}' > build/artifacts/Vimivo.xcarchive.zip.sha256
          echo "Vimivo.xcarchive.zip SHA-256: $(cat build/artifacts/Vimivo.xcarchive.zip.sha256)"

      - name: Upload iOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: vimivo-ios-archive
          path: |
            build/artifacts/Vimivo.xcarchive.zip
            build/artifacts/Vimivo.xcarchive.zip.sha256
          if-no-files-found: error
