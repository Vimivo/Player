[workspace]
resolver = "2"
members = [
    "crates/vimivo-core",
    "crates/vimivo-ffi",
    "crates/vimivo-desktop",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Md Tanvir Ahamed Shanto <mdtanvirahamdsanto987@gmail.com>"]
license = "MIT"
repository = "https://github.com/Vimivo/Player"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
rand = "0.8"
thiserror = "1.0"
uniffi = { version = "0.28" }
slint = "1.8"
